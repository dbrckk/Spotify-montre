name: Prepare exact-photo withdrawal PR (manual, never auto-merge)

on:
  workflow_dispatch:
    inputs:
      watch_id:
        description: "Exact catalogue ID, e.g. skmei-1251"
        required: true
        type: string
      confirmation:
        description: "Enter RETIRER:<watch_id> exactly; opens a PR, does not deploy"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  request-photo-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WATCH_ID: ${{ inputs.watch_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate confirmation and published photo before source changes
        run: |
          node scripts/withdraw-watch-photo.mjs --id "$WATCH_ID"
          test "$CONFIRMATION" = "RETIRER:$WATCH_ID"
      - name: Create isolated branch, remove exact media and rebuild entire site
        run: |
          set -euo pipefail
          git switch -c "withdraw-photo/$WATCH_ID-$GITHUB_RUN_ID"
          node scripts/withdraw-watch-photo.mjs --id "$WATCH_ID" --apply --confirm "$CONFIRMATION" > /tmp/takedown-result.json
          node scripts/validate-seo.mjs
          node scripts/check-photo-withdrawal.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site/ docs/deploy-package-*.json
          git commit -m "fix(rights): retire photographic assets for $WATCH_ID"
          git push --set-upstream origin "withdraw-photo/$WATCH_ID-$GITHUB_RUN_ID"
          gh pr create --base main --head "withdraw-photo/$WATCH_ID-$GITHUB_RUN_ID" \
            --title "fix(rights): retrait de la photographie $WATCH_ID" \
            --body "Retrait demandé pour $WATCH_ID. Images, dérivés, pages et packages régénérés. **Fusion humaine obligatoire après CI.** Vérifier aussi les anciennes URLs Render/CDN ; aucune purge externe n'est attestée."
          cat /tmp/takedown-result.json >> "$GITHUB_STEP_SUMMARY"
