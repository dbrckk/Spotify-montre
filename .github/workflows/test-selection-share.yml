name: Validate shared watch selections on Android
on:
  push:
    branches: [main]
    paths:
      - 'site/selection-share.js'
      - 'site/affiliation.js'
      - 'site/affiliation.html'
      - 'site/selection-affiliation.json'
      - 'scripts/test-selection-share.mjs'
      - '.github/workflows/test-selection-share.yml'
  workflow_dispatch:
concurrency:
  group: shared-selection-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  share-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check site/selection-share.js
          node --check scripts/test-selection-share.mjs
      - name: Install Chromium for mobile browser tests
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Verify native share and URL roundtrip on Android viewport
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/watch-share-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-selection-share.mjs
