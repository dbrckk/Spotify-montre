name: CJ ticket supplier read-only live diagnosis
on:
  push:
    branches: [main]
    paths:
      - 'commerce/cj-quote-ticket.mjs'
      - '.github/workflows/cj-ticket-readonly-check.yml'
  workflow_dispatch:
  schedule:
    # 08:34 CET / 09:34 CEST; GitHub may delay scheduled runs.
    - cron: '34 7 * * *'

permissions:
  contents: read

# Share CJ's one-request-per-second account limit with the manual send workflow.
concurrency:
  group: cj-landed-quote-supplier-ticket
  cancel-in-progress: false

jobs:
  diagnose-cj-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check CJ ticket without purchase or supplier write
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          if [ -z "$CJ_API_KEY" ]; then
            echo 'CJ_API_KEY_GITHUB_SECRET_MISSING (no supplier write performed)'
            exit 1
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # A failed scheduled job indicates a reply or abnormal ticket state.
            # GitHub may notify maintainers according to their Actions settings.
            node commerce/cj-quote-ticket.mjs watch
          else
            # Also exercise the live Messages endpoint in read-only mode
            # after ticket integration updates. No supplier response contents
            # or private IDs are logged.
            node commerce/cj-quote-ticket.mjs diagnose
            node commerce/cj-quote-ticket.mjs status
          fi
