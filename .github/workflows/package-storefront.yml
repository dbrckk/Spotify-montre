name: Build complete static watch storefront deployment package

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-shipstatic-bundle.py'
      - '.github/workflows/package-storefront.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-storefront-package
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # /site/montres is generated; it does not exist in the committed source.
      # Without this step, published links to all 52 watches would be broken.
      - name: Generate all catalog, product and SEO pages
        run: node scripts/build-seo.mjs
      - name: Verify public landing and fail-closed package regression tests
        run: |
          node scripts/check-public-landing-seo.mjs
          python -m unittest discover -s scripts -p 'test_photo_package_gate.py' -v
      - name: Build complete HTML, CSS, JS and genuine WebP deployment chunks
        run: python scripts/build-shipstatic-bundle.py
      - name: Save reproducible package files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/deploy-package-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: static storefront plus 15 real watch images ready to deploy [skip ci]'
            # The generator may also modify source HTML or leave untracked build files.
            # Only the committed docs/deploy-package-*.json outputs belong in this push.
            # Rebase requires a clean worktree; discard ephemeral generated files first.
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
