name: Build complete static watch storefront deployment package

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-shipstatic-bundle.py'
      - '.github/workflows/package-storefront.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-storefront-package
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete HTML, CSS, JS and genuine WebP deployment chunks
        run: python scripts/build-shipstatic-bundle.py
      - name: Save reproducible package files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/deploy-package-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: static storefront plus 15 real watch images ready to deploy [skip ci]'
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
