name: Validate premium mobile catalogue interactions
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-mobile-storefront-v8.mjs'
      - 'scripts/test-premium-readability.mjs'
      - 'scripts/test-compare-persistence.mjs'
      - 'scripts/test-selection-share.mjs'
      - 'site/selection-share.js'
      - 'site/selection-affiliation.json'
      - 'site/conseiller.html'
      - 'site/conseiller.css'
      - 'site/conseiller.js'
      - 'site/conseiller-engine.js'
      - 'scripts/test-adviser-browser.mjs'
      - 'site/affiliation.js'
      - 'site/editorial-photo.js'
      - 'site/editorial-photo.css'
      - 'site/affiliation.css'
      - 'site/catalogue-view.css'
      - 'site/premium-system.css'
      - 'site/affiliation.html'
      - 'site/montre.html'
      - 'site/fiche.js'
      - 'site/photo-zoom.js'
      - 'site/photo-zoom.css'
      - 'site/horlogerie.css'
      - 'site/comparaisons-montres.json'
      - 'site/seo-guides.css'
      - 'scripts/build-comparisons.mjs'
      - 'scripts/build-seo.mjs'
      - 'scripts/validate-seo.mjs'
      - 'scripts/test-watch-comparisons-browser.mjs'
      - '.github/workflows/test-premium-mobile.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: premium-mobile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  premium-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only the browser test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Build production-style SEO storefront for browser checks
        run: |
          node scripts/build-seo.mjs
          node scripts/validate-seo.mjs
      - name: Test source storefront through local HTTP (no deployment required)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/watch-site-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-mobile-storefront-v8.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-compare-persistence.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-selection-share.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-adviser-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-watch-comparisons-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-premium-readability.mjs
      - name: Preserve mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-watch-mobile-desktop
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
