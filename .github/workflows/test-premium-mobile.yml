name: Validate premium mobile catalogue interactions
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-mobile-storefront-v8.mjs'
      - 'scripts/test-premium-readability.mjs'
      - 'scripts/test-compare-persistence.mjs'
      - 'scripts/test-selection-share.mjs'
      - 'site/selection-share.js'
      - 'site/selection-affiliation.json'
      - 'site/editorial-insights.json'
      - 'site/conseiller.html'
      - 'site/conseiller.css'
      - 'site/conseiller.js'
      - 'site/conseiller-engine.js'
      - 'scripts/test-adviser-browser.mjs'
      - 'scripts/test-editorial-product-advisor-browser.mjs'
      - 'site/editorial-product-advisor-2026.css'
      - 'site/affiliation.js'
      - 'site/editorial-photo.js'
      - 'site/editorial-photo.css'
      - 'site/affiliation.css'
      - 'site/catalogue-view.css'
      - 'site/premium-system.css'
      - 'site/affiliation.html'
      - 'site/index.html'
      - 'site/premium-showroom.css'
      - 'site/acheter.html'
      - 'site/acheter-direct.js'
      - 'site/achat-partenaires.js'
      - 'scripts/test-partner-purchase-browser.mjs'
      - 'site/direct-commerce.css'
      - 'scripts/test-direct-commerce-browser.mjs'
      - 'site/home-editorial.css'
      - 'site/app.js'
      - 'scripts/test-home-editorial-browser.mjs'
      - 'site/montre.html'
      - 'site/fiche.js'
      - 'site/photo-zoom.js'
      - 'site/photo-zoom.css'
      - 'site/horlogerie.css'
      - 'site/comparaisons-montres.json'
      - 'site/comparaisons-accessibles.json'
      - 'site/affordable-comparisons.css'
      - 'scripts/build-affordable-comparisons.mjs'
      - 'site/seo-guides.css'
      - 'scripts/build-comparisons.mjs'
      - 'scripts/build-seo.mjs'
      - 'research/amazon-fr-popular-verified.json'
      - 'scripts/popular-verified-affiliate.mjs'
      - 'site/analytics.js'
      - 'scripts/validate-seo.mjs'
      - 'scripts/test-watch-comparisons-browser.mjs'
      - 'scripts/test-unified-compare-tray.mjs'
      - 'scripts/test-catalogue-search-browser.mjs'
      - 'scripts/build-unified-discovery.mjs'
      - 'site/unified-discovery.js'
      - 'site/catalogue-return.js'
      - 'site/unified-discovery.css'
      - 'site/unified-trust-markers.css'
      - 'site/watch-reference-copy.css'
      - 'site/watch-reference-copy.js'
      - 'site/unified-tier-finish.css'
      - 'site/unified-shopper-paths.css'
      - 'site/extra-product-viewer.js'
      - 'site/extra-source-passport.css'
      - 'site/merchant-proof-ledger.css'
      - 'scripts/build-popular-product-pages.mjs'
      - 'scripts/build-popular-editorial-thumbnails.py'
      - 'scripts/responsive-images.mjs'
      - 'site/popular-photo-rights.json'
      - 'site/extra-product-actions.js'
      - 'scripts/test-popular-product-actions-browser.mjs'
      - 'site/popular-picks.css'
      - 'scripts/build-shopper-selections.mjs'
      - 'site/shopper-selections.css'
      - 'scripts/test-intent-collections-browser.mjs'
      - 'site/photo-zoom.js'
      - 'site/photo-zoom.css'
      - '.github/workflows/test-premium-mobile.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: premium-mobile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  premium-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only the browser test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Generate SHA-verified mobile product photography for browser checks
        run: |
          python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13'
          python scripts/build-popular-editorial-thumbnails.py
      - name: Build production-style SEO storefront for browser checks
        run: |
          node scripts/build-seo.mjs
          node scripts/validate-seo.mjs
      - name: Test source storefront through local HTTP (no deployment required)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/watch-site-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-mobile-storefront-v8.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-compare-persistence.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-selection-share.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-adviser-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-editorial-product-advisor-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-watch-comparisons-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-unified-compare-tray.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-popular-product-actions-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-catalogue-search-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-intent-collections-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-premium-readability.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-home-editorial-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-direct-commerce-browser.mjs
          WATCH_STOREFRONT_URL=http://127.0.0.1:8765 node scripts/test-partner-purchase-browser.mjs
      - name: Preserve mobile and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-watch-mobile-desktop
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
