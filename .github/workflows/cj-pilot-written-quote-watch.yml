name: CJ pilot written quote — read-only watch

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
  # Run once when first merged; subsequent supplier checks are daily only.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cj-pilot-written-quote-watch.yml'
      - 'commerce/cj-quote-ticket.mjs'
      - 'commerce/cj-quote-watch-signal.mjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: cj-pilot-quote-readonly
  cancel-in-progress: false

jobs:
  supplier-written-quote:
    name: CJ supplier reply for first watch (no purchase)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check if CJ credential is available without revealing it
        id: credentials
        shell: bash
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          if [[ -n "$CJ_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read existing CJ ticket status, never submit an order or ticket
        if: steps.credentials.outputs.ready == 'true'
        id: quote
        shell: bash
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          set -euo pipefail
          node commerce/cj-quote-ticket.mjs status > "$RUNNER_TEMP/cj-ticket-readonly.json"
          node commerce/cj-quote-watch-signal.mjs "$RUNNER_TEMP/cj-ticket-readonly.json"
      - name: Create a single operator issue if CJ replied or the ticket disappeared
        if: ${{ always() && (steps.quote.outputs.attention == 'true' || steps.quote.outputs.blocked == 'true') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER='AM-CJ-FR-QUOTE-20261104-CJZBNSET00031'
          EXISTING="$(gh issue list --state all --search "$MARKER in:title" --json number --jq '.[0].number // empty' --limit 100)"
          if [[ -z "$EXISTING" ]]; then
            gh issue create \
              --title "CJ pilot quote requires review — $MARKER" \
              --body "Le contrôle en lecture seule du ticket CJ pour CJZBNSET00031-black a détecté une réponse fournisseur nécessitant vérification OU un ticket introuvable. Examiner le portail CJdropshipping et le ticket portant la référence $MARKER, sans publier les échanges privés. Vérifier le prix complet livré en France, transport, TVA, douane, dédouanement, DDP/DAP, sécurité de la montre à pile et correspondance VID/PID/SKU. Si aucun ticket n'existe, contrôler le compte CJ avant toute demande manuelle. Aucun devis n'est approuvé ; ne pas ouvrir l'encaissement. Le workflow n'a créé ni commande, ni paiement, ni débit du portefeuille CJ."
          else
            echo "Existing supplier follow-up issue #$EXISTING retained; no duplicate created."
          fi
      - name: Block automatic approval when supplier needs review
        if: steps.quote.outputs.attention == 'true'
        shell: bash
        run: |
          echo "::error::CJ supplier reply needs human source review; never activate checkout from ticket status."
          exit 1
      - name: Report an unconfigured GitHub secret
        if: steps.credentials.outputs.ready == 'false'
        shell: bash
        run: |
          echo "CJ_API_KEY is not available to this workflow. The supplier ticket has not been checked." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::CJ pilot quote cannot be checked until its existing private GitHub secret is connected."
          exit 1
