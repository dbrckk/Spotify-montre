name: Audit production SEO URLs
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-live-seo.mjs'
      - 'scripts/source-evidence-review.mjs'
      - 'research/amazon-fr-exact-products.json'
      - 'site/popular-photo-rights.json'
      - 'site/selection-populaires.json'
      - 'site/selection-affiliation.json'
      - 'scripts/test-merchant-evidence-action-plan.mjs'
      - 'scripts/report-merchant-evidence.mjs'
      - 'scripts/merchant-evidence-action-plan.mjs'
      - 'scripts/official-source-http-probe.mjs'
      - 'scripts/probe-official-sources.mjs'
      - 'scripts/test-official-source-http-probe.mjs'
      - 'scripts/test-source-evidence-review.mjs'
      - 'research/amazon-fr-popular-verified.json'
      - '.github/workflows/audit-live-seo.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-live-seo.mjs'
      - 'scripts/source-evidence-review.mjs'
      - 'research/amazon-fr-exact-products.json'
      - 'site/popular-photo-rights.json'
      - 'site/selection-populaires.json'
      - 'site/selection-affiliation.json'
      - 'scripts/test-merchant-evidence-action-plan.mjs'
      - 'scripts/report-merchant-evidence.mjs'
      - 'scripts/merchant-evidence-action-plan.mjs'
      - 'scripts/official-source-http-probe.mjs'
      - 'scripts/probe-official-sources.mjs'
      - 'scripts/test-official-source-http-probe.mjs'
      - 'scripts/test-source-evidence-review.mjs'
      - 'research/amazon-fr-popular-verified.json'
      - '.github/workflows/audit-live-seo.yml'
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate documentary proof aging and script syntax
        run: |
          node --check scripts/audit-live-seo.mjs
          node --check scripts/source-evidence-review.mjs
          node scripts/test-source-evidence-review.mjs
      - name: Generate daily source-backed merchant and photo action queue
        run: |
          node --check scripts/merchant-evidence-action-plan.mjs
          node --check scripts/report-merchant-evidence.mjs
          node scripts/test-merchant-evidence-action-plan.mjs
          node scripts/report-merchant-evidence.mjs --write-artifacts --ci-summary
      - name: Check priority official source URLs without asserting stock
        run: |
          node --check scripts/official-source-http-probe.mjs
          node --check scripts/probe-official-sources.mjs
          node scripts/test-official-source-http-probe.mjs
          node scripts/probe-official-sources.mjs --write-artifacts --ci-summary
      - name: Audit sitemap, canonical URLs and crawlability in production
        env:
          SEO_AUDIT_BASE_URL: https://atelier-montres-selection-fr.onrender.com/
        run: node scripts/audit-live-seo.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-audit
          path: |
            artifacts/live-seo-audit.json
            artifacts/merchant-evidence-action-plan.json
            artifacts/merchant-evidence-action-plan.csv
            artifacts/merchant-evidence-action-plan.md
            artifacts/official-source-http-probe.json
            artifacts/official-source-http-probe.md
          retention-days: 14
          if-no-files-found: warn
