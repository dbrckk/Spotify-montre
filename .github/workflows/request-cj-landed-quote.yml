name: CJ written full landed-cost quote (one watch, no purchase)
# One-time owner-approved support request after a live read-only account check.
# The push event only runs for the unique, audited merge subject below.
# Remove this temporary push trigger after checking CJ's acknowledgement.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/request-cj-landed-quote.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: "preview = inspect category; status = check CJ reply; send = explicitly request written quote"
        required: true
        type: choice
        options: [preview, status, send]
        default: preview
permissions:
  contents: read
concurrency:
  group: cj-landed-quote-supplier-ticket
  cancel-in-progress: false
jobs:
  one-watch-supplier-inquiry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       startsWith(github.event.head_commit.message,
       'ops(cj): submit one verified written quote 20261105'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Request a written quote only on explicit manual send
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          if [ -z "$CJ_API_KEY" ]; then
            echo 'Missing CJ_API_KEY repository secret. No supplier ticket submitted.'
            exit 1
          fi
          node commerce/cj-quote-ticket.mjs "${{ github.event_name == 'push' && 'send' || inputs.operation }}"
