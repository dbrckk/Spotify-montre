name: Verify production Render watch storefront on Android
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-published-watch-storefront.yml'
      - 'scripts/test-selection-share.mjs'
      - 'scripts/test-mobile-storefront-v8.mjs'
      - 'scripts/test-mobile-live-storefront.mjs'
      - 'scripts/test-recently-viewed.mjs'
      - 'scripts/test-compare-persistence.mjs'
      - 'site/affiliation.js'
      - 'site/selection-share.js'
      - 'site/montre.html'
      - 'site/editorial-photo.js'
      - 'site/editorial-photo.css'
      - 'site/selection-affiliation.json'
      - 'site/affiliation.html'
      - 'site/catalogue-view.css'
      - 'site/premium-system.css'
      - 'site/affiliate-ui.js'
      - 'site/fiche.js'
      - 'site/fiche.css'
      - 'site/seo-guides.css'
      - 'site/popular-picks.css'
      - 'site/popular-filters.js'
      - 'scripts/build-popular-picks.mjs'
      - 'scripts/build-seo.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-published-watch-storefront.yml'
  workflow_dispatch:
concurrency:
  group: production-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  published-android:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Wait for exact catalog JS, CSS and filterable SEO collection to reach Render
        run: |
          set -eu
          base='https://atelier-montres-selection-fr.onrender.com'
          # A healthy homepage can belong to the PREVIOUS deploy. Compare the
          # bytes of assets the browser scenario actually exercises so a stale
          # CDN build never produces a false failure or false success.
          for attempt in $(seq 1 30); do
            ready=1
            for file in affiliation.js selection-share.js affiliate-ui.js catalogue-view.css premium-system.css fiche.js fiche.css seo-guides.css editorial-photo.js editorial-photo.css popular-filters.js popular-picks.css; do
              if ! curl -fsSL --max-time 15 "$base/$file" -o "$RUNNER_TEMP/live-$file"; then
                ready=0
              elif ! cmp -s "site/$file" "$RUNNER_TEMP/live-$file"; then
                ready=0
              fi
            done
            if [ "$ready" -eq 1 ]; then
              # The indexed Citizen page is created by the SEO generator, and
              # can lag the already-deployed CSS during a rolling deployment.
              if ! curl -fsSL --max-time 15 "$base/montres/citizen-tsuyosa.html" -o "$RUNNER_TEMP/live-citizen.html"; then
                ready=0
              elif ! grep -Fq 'class="watch-facts"' "$RUNNER_TEMP/live-citizen.html"; then
                ready=0
              fi
            fi
            # An old CDN version may serve a valid homepage and the 15 existing
            # photos while still serving the PREVIOUS 13-watch collection.
            # Gate the actual new HTML before launching the Android browser.
            if [ "$ready" -eq 1 ]; then
              if ! curl -fsSL --max-time 15 "$base/montres/modeles-populaires.html" -o "$RUNNER_TEMP/live-popular.html"; then
                ready=0
              elif ! grep -Fq 'id="am-pick-filters"' "$RUNNER_TEMP/live-popular.html"; then
                ready=0
              elif ! grep -Fq 'id="am-picks-list"' "$RUNNER_TEMP/live-popular.html"; then
                ready=0
              elif ! grep -Fq 'data-pick-id="casio-gw-m5610u-1"' "$RUNNER_TEMP/live-popular.html"; then
                ready=0
              elif ! grep -Fq 'data-pick-id="seiko-speedtimer-ssc813"' "$RUNNER_TEMP/live-popular.html"; then
                ready=0
              fi
            fi
            if [ "$ready" -eq 1 ]; then
              echo "Render serves current JS/CSS and the filterable 13-watch collection (attempt $attempt)."
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then sleep 5; fi
          done
          echo 'Render CDN still serves stale or incomplete JS/CSS or the former 13-watch collection after retries.'
          exit 1
      - name: Verify deployed website, 15 local photos, sharing and watch history
        env:
          WATCH_STOREFRONT_URL: https://atelier-montres-selection-fr.onrender.com
        run: |
          timeout 180s node scripts/test-mobile-live-storefront.mjs
          timeout 180s node scripts/test-mobile-storefront-v8.mjs
          timeout 120s node scripts/test-selection-share.mjs
          timeout 120s node scripts/test-recently-viewed.mjs
          timeout 120s node scripts/test-compare-persistence.mjs
      - name: Save real deployment screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-watch-storefront-android
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
