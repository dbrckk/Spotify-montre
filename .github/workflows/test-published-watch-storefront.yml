name: Verify production Render watch storefront on Android
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-published-watch-storefront.yml'
      - 'scripts/test-selection-share.mjs'
      - 'scripts/test-mobile-storefront-v8.mjs'
      - 'scripts/test-mobile-live-storefront.mjs'
      - 'scripts/test-recently-viewed.mjs'
      - 'scripts/test-compare-persistence.mjs'
      - 'site/affiliation.js'
      - 'site/affiliation.html'
      - 'site/catalogue-view.css'
      - 'site/affiliate-ui.js'
      - 'site/fiche.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-android:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Wait for exact audited JS and CSS to reach Render CDN
        run: |
          set -eu
          base='https://atelier-montres-selection-fr.onrender.com'
          # A healthy homepage can belong to the PREVIOUS deploy. Compare the
          # bytes of assets the browser scenario actually exercises so a stale
          # CDN build never produces a false failure or false success.
          for attempt in $(seq 1 30); do
            ready=1
            for file in affiliation.js affiliate-ui.js catalogue-view.css; do
              if ! curl -fsSL --max-time 15 "$base/$file" -o "$RUNNER_TEMP/live-$file"; then
                ready=0
              elif ! cmp -s "site/$file" "$RUNNER_TEMP/live-$file"; then
                ready=0
              fi
            done
            if [ "$ready" -eq 1 ]; then
              echo "Render serves the exact current JS and CSS (attempt $attempt)."
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then sleep 5; fi
          done
          echo 'Render CDN still serves stale or incomplete JS/CSS after retries.'
          exit 1
      - name: Verify deployed website, 15 local photos, sharing and watch history
        env:
          WATCH_STOREFRONT_URL: https://atelier-montres-selection-fr.onrender.com
        run: |
          node scripts/test-mobile-live-storefront.mjs
          node scripts/test-mobile-storefront-v8.mjs
          node scripts/test-selection-share.mjs
          node scripts/test-recently-viewed.mjs
          node scripts/test-compare-persistence.mjs
      - name: Save real deployment screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-watch-storefront-android
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
