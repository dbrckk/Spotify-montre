name: Generate lightweight watch thumbnails
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-watch-thumbnails.py'
      - '.github/workflows/generate-watch-thumbnails.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for offline source-image resizing
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Generate four exact-watch WebP thumbnails
        run: python scripts/generate-watch-thumbnails.py
      - name: Publish generated thumbnails to main
        run: |
          git add site/assets/watch-thumbs/
          if git diff --cached --quiet; then
            echo 'Thumbnails are already current.'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: publish optimized local watch navigation thumbnails'
            git push origin HEAD:main
          fi
