name: Lighthouse mobile — production
on:
  workflow_dispatch:
  # Measure once the image generator has finished writing authenticated
  # variants; GITHUB_TOKEN-generated commits do not trigger push workflows.
  workflow_run:
    workflows: ["Build verified responsive watch WebP assets"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-mobile.yml'
      - 'scripts/report-lighthouse-mobile.mjs'
      - 'site/editorial-photo.js'
      - 'site/editorial-photo.css'
      - 'site/affiliation.html'
      - 'site/index.html'
      - 'site/public-home.css'
      - 'site/premium-showroom.css'
      - 'site/base.css'
      - 'site/features.css'
      - 'site/direct-offer-links.js'
      - 'site/direct-offer-links.css'
      - 'site/catalogue-view.css'
      - 'site/unified-discovery.css'
      - 'site/unified-trust-markers.css'
      - 'site/watch-reference-copy.css'
      - 'site/watch-reference-copy-v2.js'
      - 'site/unified-recent-history.js'
      - 'site/unified-recent-history.css'
      - 'site/unified-tier-finish.css'
      - 'site/unified-shopper-paths.css'
      - 'site/unified-discovery.js'
      - 'scripts/build-unified-discovery.mjs'
      - 'site/discovery-catalogue.json'
      - 'site/premium-system.css'
      - 'site/seo-guides.css'
      - 'site/popular-picks.css'
      - 'site/shopper-selections.css'
      - 'scripts/build-shopper-selections.mjs'
      - 'site/extra-source-passport.css'
      - 'site/merchant-proof-ledger.css'
      - 'site/extra-product-viewer.js'
      - 'scripts/build-popular-product-pages.mjs'
      - 'site/assets/watch-thumbs/**'
      - 'site/assets/watch-responsive/**'
      - 'site/assets/popular-responsive/**'
      - 'scripts/build-popular-editorial-thumbnails.py'
      - 'site/assets/watches-popular/**'
      - 'site/popular-photo-rights.json'
      - 'scripts/build-popular-editorial-thumbnails.py'
      - 'scripts/build-seo.mjs'
      - 'research/amazon-fr-popular-verified.json'
      - 'scripts/popular-verified-affiliate.mjs'
      - 'site/analytics.js'
      - 'scripts/responsive-images.mjs'
      - 'site/affiliation.js'
  schedule:
    - cron: '31 6 * * 1'
concurrency:
  group: lighthouse-mobile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run carries the triggering asset job's older SHA. Render
      # deploys main, including authenticated WebP commits made afterwards.
      # Always build/compare Lighthouse inputs from the current public branch.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record deployed source revision
        run: echo "Production Lighthouse uses main at $(git rev-parse --short HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild SHA-verified product WebPs before live-page comparison
        run: |
          python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13'
          python scripts/build-popular-editorial-thumbnails.py
      - name: Validate reports and regenerate exact product markup
        run: |
          node --check scripts/report-lighthouse-mobile.mjs
          node scripts/build-seo.mjs
          node scripts/validate-seo.mjs
      - name: Wait for published CSS and gallery code to match this commit
        run: |
          set -eu
          base='https://atelier-montres-selection-fr.onrender.com'
          for attempt in $(seq 1 72); do
            ready=1
            for file in public-home.css premium-showroom.css base.css features.css direct-offer-links.js direct-offer-links.css seo-guides.css catalogue-view.css premium-system.css editorial-photo.js unified-discovery.css unified-trust-markers.css watch-reference-copy.css watch-reference-copy-v2.js unified-recent-history.js unified-recent-history.css unified-tier-finish.css unified-shopper-paths.css unified-discovery.js popular-picks.css shopper-selections.css extra-source-passport.css merchant-proof-ledger.css extra-product-viewer.js; do
              if ! curl -fsSL --max-time 15 "$base/$file" -o "$RUNNER_TEMP/lh-$file"; then
                ready=0
              elif ! cmp -s "site/$file" "$RUNNER_TEMP/lh-$file"; then
                ready=0
              fi
            done
            if ! curl -fsSL --max-time 15 "$base/index.html" -o "$RUNNER_TEMP/lh-index.html"; then
              ready=0
            elif ! python3 - "$RUNNER_TEMP/lh-index.html" <<'PY'
          import pathlib,sys
          local=pathlib.Path('site/index.html').read_text()
          live=pathlib.Path(sys.argv[1]).read_text()
          # SEO generation can inject verification and analytics into <head>.
          # Compare the entire customer-visible <main> and navigation instead.
          def visible(html):
              return html[html.index('<header class="header">'):html.index('</main>')+len('</main>')]
          assert visible(local)==visible(live), 'Deployed customer-visible homepage differs from source'
          PY
            then
              ready=0
            fi
            # The 2026 studio refresh changes generated product HTML, not
            # merely CSS. Confirm both real-photo and honest no-photo routes
            # have been deployed before auditing them.
            for product in skmei-1251 casio-f91w-1 tissot-prx-35-blue casio-dw5600rl-1 tissot-le-locle-white casio-la-20wh-4a1 tissot-gentleman-auto; do
              if ! curl -fsSL --max-time 15 "$base/montres/$product.html" -o "$RUNNER_TEMP/lh-$product.html"; then
                ready=0
              elif ! python3 - "$product" "$RUNNER_TEMP/lh-$product.html" <<'PY'
          import pathlib,sys
          product,live_path=sys.argv[1:]
          local=pathlib.Path('site/montres/'+product+'.html').read_text()
          live=pathlib.Path(live_path).read_text()
          def article(html):
              start=html.index('<article class="am-extra-product"')
              return html[start:html.index('</article>',start)+len('</article>')]
          assert article(local)==article(live), 'Published product article differs from generated source: '+product
          # Photo approval is data-driven: official images can be added to the
          # registry without changing the production Lighthouse expectations.
          # This also catches a gallery that silently drops an approved photo.
          import json
          approved=json.loads(pathlib.Path('site/popular-photo-rights.json').read_text())['photos']
          expected_photo=product in approved
          has_photo_stage='class="am-extra-photo-stage"' in live
          has_licensed_photo='class="am-extra-licensed-photo"' in live
          assert has_photo_stage==expected_photo, (
              f'Photo stage mismatch for {product}: deployed={has_photo_stage}, approved={expected_photo}')
          assert has_licensed_photo==expected_photo, (
              f'Approved image mismatch for {product}: deployed={has_licensed_photo}, approved={expected_photo}')
          if expected_photo:
              assert approved[product]['file'].split('/')[-1] in live, (
                  'Wrong approved photo file in deployed article: '+product)
          affiliate_active=json.loads(pathlib.Path('site/affiliate-links.json').read_text()).get('enabled') is True
          if affiliate_active:
              for model,asin in [('casio-dw5600rl-1','B0DN6LT6FX'),
                                 ('tissot-le-locle-white','B01N7FXE80'),
                                 ('casio-la-20wh-4a1','B077YZHF21'),
                                 ('tissot-gentleman-auto','B07XTVQ3W7')]:
                  if product==model:
                      assert 'https://www.amazon.fr/dp/'+asin+'?tag=drackk04-21' in live, 'Exact paid destination not published: '+model
          if product=='tissot-prx-35-blue':
              assert 'popular-responsive/tissot-prx-35-blue-960.webp' in live, 'New Tissot responsive original unavailable'

          PY
              then
                ready=0
              fi
            done
            # Unlike untracked verification tags in <head>, the shopper-facing
            # article must exactly match the fresh builder output. Prevent a
            # Lighthouse pass on stale HTML with new JS/CSS assets.
            for core in casio-mtp-1302 citizen-tsuyosa; do
              if ! curl -fsSL --max-time 15 "$base/montres/$core.html" -o "$RUNNER_TEMP/lh-core-$core.html"; then
                ready=0
              elif ! python3 - "$core" "$RUNNER_TEMP/lh-core-$core.html" <<'PY'
          import pathlib,sys
          watch_id,live_path=sys.argv[1:]
          local=pathlib.Path('site/montres/'+watch_id+'.html').read_text()
          live=pathlib.Path(live_path).read_text()
          def article(html):
              start=html.index('<article class="watch watch-product"')
              return html[start:html.index('</article>',start)+len('</article>')]
          assert article(local)==article(live), 'Stale core model article: '+watch_id
          assert 'data-watch-ref-copy="'+watch_id+'"' in live
           assert 'class="secondary am-interactive-detail-link" href="../montre.html?id='+watch_id+'"' in live
          assert 'href="../watch-reference-copy.css"' in live
          assert 'src="../watch-reference-copy-v2.js"' in live
          PY
              then
                ready=0
              fi
            done
            if [ "$ready" -eq 1 ]; then
              echo "Lighthouse will measure the deployed homepage, source-matched watch pages and full styles."
              exit 0
            fi
            if [ "$attempt" -lt 72 ]; then sleep 5; fi
          done
          echo "Render has not published the matching homepage and assets for this Lighthouse run."
          exit 1
      - name: Audit homepage, 52-watch catalogue, core Casio and photo/no-photo product sheets
        run: |
          mkdir -p artifacts
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          for n in 1 2 3; do
            npx --yes lighthouse@12 "https://atelier-montres-selection-fr.onrender.com/" --chrome-path="$CHROME" --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --max-wait-for-load=45000 --output=json --output-path="artifacts/lighthouse-mobile-home-$n.json" --quiet
          done
          npx --yes lighthouse@12 "https://atelier-montres-selection-fr.onrender.com/montres/toutes-les-montres.html" --chrome-path="$CHROME" --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --max-wait-for-load=45000 --output=json --output-path=artifacts/lighthouse-mobile-catalogue.json --quiet
          npx --yes lighthouse@12 "https://atelier-montres-selection-fr.onrender.com/montres/casio-mtp-1302.html" --chrome-path="$CHROME" --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --max-wait-for-load=45000 --output=json --output-path=artifacts/lighthouse-mobile-product.json --quiet
          npx --yes lighthouse@12 "https://atelier-montres-selection-fr.onrender.com/montres/skmei-1251.html" --chrome-path="$CHROME" --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --max-wait-for-load=45000 --output=json --output-path=artifacts/lighthouse-mobile-studio-photo.json --quiet
          npx --yes lighthouse@12 "https://atelier-montres-selection-fr.onrender.com/montres/casio-f91w-1.html" --chrome-path="$CHROME" --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --max-wait-for-load=45000 --output=json --output-path=artifacts/lighthouse-mobile-no-photo.json --quiet
          npx --yes lighthouse@12 "https://atelier-montres-selection-fr.onrender.com/montres/montres-femme-accessibles.html" --chrome-path="$CHROME" --chrome-flags="--headless --no-sandbox" --only-categories=performance --form-factor=mobile --max-wait-for-load=45000 --output=json --output-path=artifacts/lighthouse-mobile-curated-femme.json --quiet
      - name: Build median-based, inspectable report
        run: node scripts/report-lighthouse-mobile.mjs
      - name: Save Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile-reports
          path: artifacts/lighthouse-*.json
          retention-days: 14
          if-no-files-found: ignore
