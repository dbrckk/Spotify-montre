name: Build verified responsive watch WebP assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-responsive-watch-photos.py'
      - 'scripts/build-popular-editorial-thumbnails.py'
      - 'site/popular-photo-rights.json'
      - 'site/assets/watches-popular/**'
      - 'site/selection-affiliation.json'
      - 'site/assets/watches/**'
      - '.github/workflows/build-responsive-watch-photos.yml'
  pull_request:
    paths:
      - 'scripts/build-popular-editorial-thumbnails.py'
      - 'scripts/build-responsive-watch-photos.py'
      - 'scripts/popular-photo-rights.mjs'
      - 'scripts/responsive-images.mjs'
      - 'scripts/build-unified-discovery.mjs'
      - 'site/popular-photo-rights.json'
      - 'site/assets/watches-popular/**'
      - 'site/selection-affiliation.json'
      - 'site/assets/watches/**'
      - '.github/workflows/build-responsive-watch-photos.yml'
permissions:
  contents: write
concurrency:
  group: responsive-watch-photos
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local image optimizer
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Verify source digests and generate responsive local WebPs
        run: |
          python scripts/build-responsive-watch-photos.py
          python scripts/build-popular-editorial-thumbnails.py
      - name: Verify every approved derivative in the catalogue and product detail pages
        if: github.event_name == 'pull_request'
        run: |
          node --check scripts/build-unified-discovery.mjs
          node --check scripts/responsive-images.mjs
          node scripts/build-seo.mjs
          node scripts/validate-seo.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const rights=JSON.parse(readFileSync('site/popular-photo-rights.json','utf8')).photos;
          const html=readFileSync('site/montres/toutes-les-montres.html','utf8');
          assert.ok(Object.keys(rights).length>=21&&Object.keys(rights).length<=37,
            'Only existing documented models may enter approved photo registry');
          let total=0;
          for(const [id,proof] of Object.entries(rights)){
            const start=html.indexOf('id="modele-'+id+'"');
            assert.ok(start>=0,'Missing exact-model catalogue card: '+id);
            const end=html.indexOf('</article>',start);
            assert.ok(end>start,'Missing card close: '+id);
            const card=html.slice(start,end);
            const detail=readFileSync('site/montres/'+id+'.html','utf8');
            for(const width of [240,480,720,960].filter(w=>w<proof.width)){
              const descriptor='popular-responsive/'+id+'-'+width+'.webp '+width+'w';
              assert.ok(card.includes(descriptor),
                'Verified derivative missing from catalogue: '+id+'/'+width);
              assert.ok(detail.includes(descriptor),
                'Verified derivative missing from product sheet: '+id+'/'+width);
              total++;
            }
            assert.ok(detail.includes('watches-popular/'+id+'.webp '+proof.width+'w'),
              'Full-resolution authorized fallback missing: '+id);
          }
          const expected=Object.values(rights).reduce((sum,proof)=>
            sum+[240,480,720,960].filter(w=>w<proof.width).length,0);
          assert.equal(total,expected,'Expected one verified derivative per eligible width');
          console.log('PASS: '+Object.keys(rights).length+' approved photos -> '+total+
            ' SHA-verified responsive WebPs on catalogue and detailed pages');
          NODE
      - name: Commit verified derivatives
        if: github.event_name != 'pull_request'
        run: |
          git add site/assets/watch-responsive/ site/assets/popular-responsive/
          if git diff --cached --quiet; then
            echo 'Responsive WebPs already up to date'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'assets: refresh approved responsive watch WebPs [skip ci]'
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
